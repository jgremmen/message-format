# Default (root locale) resources for parameter formatters, read in UTF-8.
#
# Localized variants are placed next to this file and follow the resource bundle naming scheme, e.g.
# FormatterResources_de.properties or FormatterResources_de_CH.properties. A key missing in a localized variant is
# looked up in the more general variants and finally in this file.

this.array=(this array)
this.collection=(this collection)
this.map=(this map)
