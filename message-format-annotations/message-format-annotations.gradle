//file:noinspection DependencyNotationArgument
//file:noinspection GroovyAssignabilityCheck


import de.sayayi.gradle.BuildSupport
import de.sayayi.gradle.RelocateAsmClasses
import de.sayayi.gradle.RelocateAsmReferences


plugins {
  id 'de.sayayi.message.base'
  id 'de.sayayi.message.java-library'
  id 'de.sayayi.message.javadoc'
  id 'de.sayayi.message.publish'
}


description = 'Message Format Library (annotations)'


configurations {
  asmToBundle

  compileOnly.extendsFrom asmToBundle
  testImplementation.extendsFrom asmToBundle
}


dependencies {
  api project(':message-format')

  asmToBundle libs.asm
}


// package the bundled ASM library is relocated to
def relocatedAsmPackage = 'de.sayayi.lib.message.annotation.adopter.asm'


tasks.named('compileJava') {
  doLast(new RelocateAsmReferences(destinationDirectory, relocatedAsmPackage))
}


def asmMainDir = layout.buildDirectory.dir('classes/asm/main')


tasks.register('prepareRelocatedAsmClasses', RelocateAsmClasses) {
  description = 'Prepare relocated ASM library classes.'

  asmJars.from(configurations.asmToBundle)
  relocatedPackage = relocatedAsmPackage
  outputDirectory = asmMainDir
}


sourceSets.main.output.dir(asmMainDir, builtBy: 'prepareRelocatedAsmClasses')


// the relocated ASM classes are only part of the jar; provides the jar to the message-gradle-plugin project
configurations.consumable('annotationsJarElements') {
  attributes {
    attribute(
        Category.CATEGORY_ATTRIBUTE,
        objects.named(Category, 'annotations-jar'))
  }

  outgoing.artifact(tasks.named('jar'))
}


tasks.named('processResources') {
  // version of the bundled ASM library, mentioned in META-INF/NOTICE
  def asmVersion = providers.provider {
    configurations
        .asmToBundle
        .incoming
        .resolutionResult
        .allComponents
        .find { it.moduleVersion?.group == 'org.ow2.asm' && it.moduleVersion?.name == 'asm' }
        ?.moduleVersion
        ?.version
  }
  def copyrightYear = commitTime.map { it.year as String }

  inputs.property('asmVersion', asmVersion)
  inputs.property('copyrightYear', copyrightYear)

  filesMatching('META-INF/NOTICE') {
    expand(copyright: copyrightYear.get(), asmVersion: asmVersion.get())
  }
}


tasks.named('sourcesJar') {
  eachFile { fileCopyDetails ->
    if (!fileCopyDetails.directory && fileCopyDetails.name.endsWith('.java')) {
      filter { line -> line.replace('org.objectweb.asm', relocatedAsmPackage) }
    }
  }
}


tasks.named('javadoc', Javadoc) {
  (options as StandardJavadocDocletOptions).with {
    group('Adopters', [
        'de.sayayi.lib.message.annotation',
    ])

    linksOffline(
        "https://javadoc.io/doc/de.sayayi.lib/message-format/${project.version}/",
        "${rootDir}/gradle/javadocs/message-format")
    linksOffline(
        "https://javadoc.io/doc/org.jetbrains/annotations/${resolveVersion('annotations')}/",
        "${rootDir}/gradle/javadocs/jetbrains-annotations")
  }
}


publishOnCentral {
  projectDescription =
      'Annotation-based extension for the Message Format library, allowing messages and templates to be declared ' +
      'directly in Java source code.'
}


publishing {
  publications {
    withType(MavenPublication).configureEach {
      pom {
        inceptionYear = '2025'

        url = "https://lib.sayayi.de/message-format/${releaseVersion}/adopter/annotation/"

        licenses {
          license {
            name = 'BSD-3-Clause'
            url = 'https://asm.ow2.io/license.html'
            comments = 'Applies to the bundled ASM library, relocated to package ' +
                'de.sayayi.lib.message.annotation.adopter.asm'
          }
        }
      }
    }
  }
}


BuildSupport.configureSnapshotRelease(project) {
  dependsOn ':message-format-annotations:publishOSSRHPublicationToMavenCentralSnapshotRepository'
}
