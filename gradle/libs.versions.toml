[versions]
# message format version
message-format = '0.24.1-SNAPSHOT'

antlr4 = '[4.13.0,4.14)'
asm = '[9.10,10)'
antlr4-ext = '[0.6,0.8)'
icu4j = '[74.1,79.0)'
jetbrains-annotations = '[24.0,26.2)'
junit = '6.1.+'
log4j = '[2.0,3.0)'
lombok = '1.18.+'
mockito = '5.23.+'
pack = '[0.1.2,0.4)'
publish-on-central = '9.2.8'
spring = '[6.0.8,7.1)'
test-logger = '4.0.0'

[libraries]
antlr4 = { module = 'org.antlr:antlr4', version.ref = "antlr4" }
antlr4-runtime = { module = 'org.antlr:antlr4-runtime', version.ref = 'antlr4' }
antlr4-ext-runtime = { module = 'de.sayayi.lib:antlr4-runtime-ext', version.ref = 'antlr4-ext' }
asm = { module = 'org.ow2.asm:asm', version.ref = 'asm' }
asm-commons = { module = 'org.ow2.asm:asm-commons', version.ref = 'asm' }
icu4j = { module = 'com.ibm.icu:icu4j', version.ref = 'icu4j' }
jetbrains-annotations = { module = 'org.jetbrains:annotations', version.ref = 'jetbrains-annotations' }
junit-jupiter-api = { module = 'org.junit.jupiter:junit-jupiter-api', version.ref = 'junit' }
junit-jupiter-params = { module = 'org.junit.jupiter:junit-jupiter-params', version.ref = 'junit' }
junit-jupiter-engine = { module = 'org.junit.jupiter:junit-jupiter-engine', version.ref = 'junit' }
junit-platform-launcher = { module = 'org.junit.platform:junit-platform-launcher', version.ref = 'junit' }
log4j-api = { module = 'org.apache.logging.log4j:log4j-api', version.ref = 'log4j' }
log4j-core = { module = 'org.apache.logging.log4j:log4j-core', version.ref = 'log4j' }
lombok = { module = 'org.projectlombok:lombok', version.ref = 'lombok' }
mockito-core = { module = 'org.mockito:mockito-core', version.ref = 'mockito' }
pack = { module = 'de.sayayi.lib:pack', version.ref = 'pack' }
spring-core = { module = 'org.springframework:spring-core', version.ref = 'spring' }
spring-context = { module = 'org.springframework:spring-context', version.ref = 'spring' }

[bundles]
antlr4-runtime = [ 'antlr4-runtime', 'antlr4-ext-runtime' ]
mockito-test = [ 'mockito-core' ]

[plugins]
publish-gradle-plugin = { id = 'com.gradle.plugin-publish', version = '2.1.1' }
publish-on-central = { id = 'org.danilopianini.publish-on-central', version.ref = 'publish-on-central' }
test-logger = { id = 'com.adarshr.test-logger', version.ref = 'test-logger' }
