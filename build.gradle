plugins {
  id 'de.sayayi.message.base' apply false
  id 'de.sayayi.message.java-library' apply false
  id 'de.sayayi.message.javadoc' apply false
  id 'de.sayayi.message.publish' apply false
}


description = 'Message Format Library Projects'


allprojects {
  group = 'de.sayayi.lib'
  version = rootProject.libs.versions.message.format.get()
}


pluginManager.apply('de.sayayi.message.base')


// local repositories of all subprojects, provided by the de.sayayi.message.publish plugin
def projectLocalRepositories = configurations.dependencyScope('projectLocalRepositories')
def projectLocalRepositoryDirs = configurations.resolvable('projectLocalRepositoryDirs') {
  extendsFrom projectLocalRepositories.get()

  attributes {
    attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, 'project-local-repository'))
  }
}

dependencies {
  subprojects.each { subproject -> add(projectLocalRepositories.name, project(subproject.path)) }
}


tasks.register('releaseAllDryRun', Sync) {
  group = 'release'
  description = 'Release all artifacts to temporary Maven repository.'

  into layout.buildDirectory.dir('repository')
  from projectLocalRepositoryDirs
}


tasks.register(snapshot ? 'releaseAllSnapshots' : 'releaseAll') {
  group = 'release'
  description = snapshot
      ? 'Release all snapshot artifacts to Maven Central Repository.'
      : 'Release final artifacts to Maven Central repository.'

  inputs.property('snapshot', snapshot)

  dependsOn ':message-format:releaseMessageFormatArtifacts'
  dependsOn ':message-format-annotations:releaseMessageFormatAnnotationsArtifacts'
  dependsOn ':message-format-spring:releaseMessageFormatSpringArtifacts'

  dependsOn ':message-gradle-plugin:releaseMessageGradlePluginArtifacts'
}


tasks.named('clean') {
  delete layout.projectDirectory.dir('build')
}


tasks.named('wrapper', Wrapper) {
  distributionType = Wrapper.DistributionType.ALL
}
