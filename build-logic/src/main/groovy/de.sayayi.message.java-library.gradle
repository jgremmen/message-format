plugins {
  id 'java-library'
  id 'com.adarshr.test-logger'
}


configurations.named('compileOnly') {
  extendsFrom configurations.annotationProcessor
}


configurations.named('testAnnotationProcessor') {
  extendsFrom configurations.annotationProcessor
}


configurations.named('testCompileOnly') {
  extendsFrom configurations.compileOnly, configurations.testAnnotationProcessor
}


dependencies {
  compileOnly rootProject.libs.jetbrains.annotations

  testAnnotationProcessor rootProject.libs.lombok

  testImplementation rootProject.libs.bundles.mockito.test
  testImplementation rootProject.libs.junit.jupiter.api
  testImplementation rootProject.libs.junit.jupiter.params

  testRuntimeOnly rootProject.libs.junit.jupiter.engine
  testRuntimeOnly rootProject.libs.junit.platform.launcher
}


java {
  withJavadocJar()
  withSourcesJar()
}


test {
  useJUnitPlatform()
}


jar.dependsOn test


tasks.withType(Jar).configureEach {
  includeEmptyDirs = false
  preserveFileTimestamps = true
  reproducibleFileOrder = true

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': project.group,
        'Implementation-Title': project.name,
        'Implementation-Version': releaseVersion,
        'Implementation-URL': "https://lib.sayayi.de/message-format/${releaseVersion}/",
        'Created-By': System.getProperty('java.version'),
        'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
    )
  }

  from(rootDir) {
    include 'LICENSE'
    into 'META-INF'
    expand(
        copyright: new Date().format('yyyy'),
        version: project.version)
  }
}


tasks.withType(JavaCompile).configureEach {
  javaCompiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(21)
  }

  options.encoding = 'UTF-8'
  options.compilerArgs << '-parameters'
}


tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }

  defaultCharacterEncoding = 'UTF-8'

  // Disable class data sharing to avoid bootstrap classpath warning from Lombok
  jvmArgs '-Xshare:off'

  doFirst {
    def byteBuddyAgent = configurations.testRuntimeClasspath.find { it.name.contains('byte-buddy-agent') }
    if (byteBuddyAgent)
      jvmArgs "-javaagent:${byteBuddyAgent.absolutePath}"
  }
}


tasks.named('compileJava') {
  sourceCompatibility = 21
  targetCompatibility = 21
}


tasks.named('compileTestJava') {
  sourceCompatibility = 21
  targetCompatibility = 21
}


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}
