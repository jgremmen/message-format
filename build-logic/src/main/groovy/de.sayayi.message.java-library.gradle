//file:noinspection DependencyNotationArgument


import java.time.Instant

import static java.time.ZoneOffset.UTC


plugins {
  id 'java-library'
  id 'com.adarshr.test-logger'
}


configurations.named('compileOnly') {
  extendsFrom configurations.annotationProcessor
}


configurations.named('testAnnotationProcessor') {
  extendsFrom configurations.annotationProcessor
}


configurations.named('testCompileOnly') {
  extendsFrom configurations.compileOnly, configurations.testAnnotationProcessor
}


dependencies {
  compileOnly libs.jetbrains.annotations

  testAnnotationProcessor libs.lombok

  testImplementation libs.bundles.mockito.test
  testImplementation libs.junit.jupiter.api
  testImplementation libs.junit.jupiter.params

  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher
}


java {
  withJavadocJar()
  withSourcesJar()
}


test {
  useJUnitPlatform()
}


// time of the last commit
ext.commitTime = providers
    .exec {
      workingDir = rootDir
      commandLine 'git', 'log', '-1', '--format=%ct'
    }
    .standardOutput
    .asText
    .map { Instant.ofEpochSecond(it.trim() as long).atOffset(UTC) }


tasks.named('jar') {
  dependsOn tasks.named('test')
}


tasks.withType(Jar).configureEach {
  includeEmptyDirs = false

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': project.group,
        'Implementation-Title': project.name,
        'Implementation-Version': releaseVersion,
        'Implementation-URL': "https://lib.sayayi.de/message-format/${releaseVersion}/",
        'Created-By': System.getProperty('java.version'),
        'Built-Date': commitTime.map { it.format('yyyy-MM-dd HH:mm:ss') }
    )
  }

  from(rootDir) {
    include 'LICENSE'
    into 'META-INF'
    expand(
        copyright: commitTime.get().year,
        version: project.version)
  }
}


tasks.withType(JavaCompile).configureEach {
  javaCompiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(21)
  }

  options.release = 21
  options.encoding = 'UTF-8'
  options.compilerArgs << '-parameters'
}


tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }

  defaultCharacterEncoding = 'UTF-8'

  // Disable class data sharing to avoid bootstrap classpath warning from Lombok
  jvmArgs '-Xshare:off'

  doFirst {
    def byteBuddyAgent = configurations.testRuntimeClasspath.find { it.name.contains('byte-buddy-agent') }
    if (byteBuddyAgent)
      jvmArgs "-javaagent:${byteBuddyAgent.absolutePath}"
  }
}


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}
