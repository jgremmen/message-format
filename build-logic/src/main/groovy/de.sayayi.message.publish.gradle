//file:noinspection GroovyAssignabilityCheck


import de.sayayi.gradle.BuildSupport


plugins {
  id 'org.danilopianini.publish-on-central'
}


publishOnCentral {
  repoOwner = 'jgremmen'

  // lazy, as the project scripts set the description after applying this plugin
  projectLongName = providers.provider { project.description }

  licenseName = 'Apache License, Version 2.0'
  licenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0'

  projectUrl = 'https://github.com/jgremmen/message-format'
  scmConnection = 'scm:git:git://github.com/jgremmen/message-format.git'
}


publishing {
  publications {
    withType(MavenPublication).configureEach {
      pom {
        developers {
          developer {
            id = 'jgremmen'
            name = 'Jeroen Gremmen'
            email = 'jeroen.gremmen@sayayi.de'
          }
        }
      }
    }
  }

  if (snapshot) {
    repositories {
      maven {
        name = 'mavenCentralSnapshot'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'

        mavenContent {
          snapshotsOnly()
        }

        credentials {
          username = providers.gradleProperty('mavenCentralPortalUsername').orNull
          password = providers.gradleProperty('mavenCentralPortalPassword').orNull
        }
      }
    }
  }
}


// publish verified artifacts only
tasks.withType(AbstractPublishToMaven).configureEach {
  dependsOn tasks.named('check')
}


def projectLocalRepositoryDir = layout.buildDirectory.dir('project-local-repository')

def publishToProjectLocalRepository = tasks.register('publishToProjectLocalRepository') {
  group = PublishingPlugin.PUBLISH_TASK_GROUP
  description = 'Create a local repository with releasable artifacts.'

  dependsOn tasks.named('publishOSSRHPublicationToProjectLocalRepository')

  outputs.dir projectLocalRepositoryDir
}


// provides the local repository to the root project (releaseAllDryRun)
configurations.consumable('projectLocalRepositoryElements') {
  attributes {
    attribute(
        Category.CATEGORY_ATTRIBUTE,
        objects.named(Category, 'project-local-repository'))
  }

  outgoing.artifact(projectLocalRepositoryDir) {
    type = 'directory'
    builtBy publishToProjectLocalRepository
  }
}


tasks.named('zipMavenCentralPortalPublication') {
  mustRunAfter 'publishToProjectLocalRepository'
}


ext.releaseTask = BuildSupport.registerReleaseTask(project)
ext.releaseTask.configure {
  if (snapshot)
    dependsOn 'publishOSSRHPublicationToMavenCentralSnapshotRepository'
  else {
    dependsOn 'zipMavenCentralPortalPublication'
    dependsOn 'validateMavenCentralPortalPublication'
    dependsOn 'releaseMavenCentralPortalPublication'
  }
}


tasks.configureEach {
  if (name.endsWith('ToMavenLocal') || (snapshot && name.contains('MavenCentralPortal')))
    group = null
}
