tasks.named('javadoc', Javadoc) {
  title = "${project.description} ${version}"

  (options as StandardJavadocDocletOptions).with {
    encoding 'UTF-8'

    noQualifiers 'java.util', 'java.lang'

    addBooleanOption('Xdoclint:all,-missing', true)
    addStringOption('-show-module-contents', 'api')
  }

  failOnError = true
}


ext.resolveVersion = { moduleName ->
  def component = configurations
      .compileClasspath
      .incoming
      .resolutionResult
      .allComponents
      .find { it.moduleVersion?.name == moduleName }

  if (component == null)
    throw new GradleException("module '${moduleName}' not found in ${project.path} compile classpath")

  component.moduleVersion.version
}
